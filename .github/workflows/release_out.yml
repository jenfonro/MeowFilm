name: release_out

on:
  workflow_dispatch:
    inputs:
      out_tag:
        description: "Release tag for out build (e.g. out/v1.0.0 or v1.0.0-out)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build-out-${{ matrix.goos }}-${{ matrix.goarch }}-${{ matrix.flavor }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-20.04
            cc: gcc
            flavor: glibc
          - goos: linux
            goarch: arm64
            runner: ubuntu-20.04
            cc: aarch64-linux-gnu-gcc
            flavor: glibc
          - goos: linux
            goarch: amd64
            runner: ubuntu-20.04
            cc: musl-gcc
            flavor: musl
          - goos: windows
            goarch: amd64
            runner: ubuntu-20.04
            cc: x86_64-w64-mingw32-gcc
            flavor: mingw

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          v="${{ inputs.out_tag }}"
          if [[ -z "${v}" ]]; then
            echo "out_tag is required" >&2
            exit 1
          fi
          if [[ "${v}" != v* ]]; then
            # Allow namespaced tags like "out/v1.0.0".
            if [[ "${v}" != */v* ]]; then
              echo "out_tag must start with 'v' or contain '/v' (e.g. v1.0.0 or out/v1.0.0)" >&2
              exit 1
            fi
          fi
          if [[ "${v}" =~ [[:space:]] ]]; then
            echo "out_tag must not contain spaces" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install linux arm64 cross compiler
        if: matrix.goos == 'linux' && matrix.goarch == 'arm64'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Install musl toolchain
        if: matrix.goos == 'linux' && matrix.flavor == 'musl'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install mingw toolchain
        if: matrix.goos == 'windows' && matrix.flavor == 'mingw'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: jenfonro/MeowFilm-Frontend
          path: MeowFilm-Frontend
          fetch-depth: 0
          token: ${{ secrets.FRONTEND_TOKEN }}

      - name: Build frontend
        shell: bash
        run: |
          set -euo pipefail
          cd MeowFilm-Frontend
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install
          fi
          npm run build

      - name: Copy frontend dist
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public/dist
          mkdir -p public/dist
          cp -a MeowFilm-Frontend/dist/. public/dist/

      - name: Test
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          go test ./...

      - name: Build (restricted out)
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.cc }}
          ASSET_VERSION: ${{ inputs.out_tag }}
          OUT_DIR: dist
          MEOWFILM_WATERMARK: out-${{ inputs.out_tag }}-${{ matrix.goos }}-${{ matrix.goarch }}-${{ matrix.flavor }}
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          bash build_out.sh
          ext=""
          if [[ "${GOOS}" == "windows" ]]; then ext=".exe"; fi
          mv "dist/meowfilm${ext}" "dist/meowfilm_${GOOS}_${GOARCH}_${{ matrix.flavor }}${ext}"
          # keep dist clean for release assets
          find dist -maxdepth 1 -type f -name 'meowfilm_*' ! -name "meowfilm_${GOOS}_${GOARCH}_${{ matrix.flavor }}${ext}" -delete
          echo "built: dist/meowfilm_${GOOS}_${GOARCH}_${{ matrix.flavor }}${ext}"

      - uses: actions/upload-artifact@v4
        with:
          name: meowfilm_out_${{ matrix.goos }}_${{ matrix.goarch }}_${{ matrix.flavor }}
          path: dist/
          if-no-files-found: error

  release:
    name: release-out
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout frontend (for release notes)
        uses: actions/checkout@v4
        with:
          repository: jenfonro/MeowFilm-Frontend
          path: MeowFilm-Frontend
          fetch-depth: 0
          token: ${{ secrets.FRONTEND_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: release-dist

      - name: Flatten artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find release-dist -maxdepth 2 -type f -print0 | xargs -0 -I{} mv {} dist/
          ls -la dist

      - name: Generate release notes (backend + frontend)
        shell: bash
        run: |
          set -euo pipefail

          current_tag="${{ inputs.out_tag }}"

          {
            echo "## Build"
            echo "- version: ${current_tag}"
            echo "- backend: $(git rev-parse --short=7 HEAD) ($(git rev-parse HEAD))"
            echo "- frontend: $(git -C MeowFilm-Frontend rev-parse --short=7 HEAD) ($(git -C MeowFilm-Frontend rev-parse HEAD))"
            echo
            echo "## Notes"
            echo "- This is the restricted public build (max users enforced)."
          } > notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.out_tag }}
          name: ${{ inputs.out_tag }}
          body_path: notes.md
          files: dist/*
          make_latest: false

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  prepare_release:
    name: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Ensure release exists
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          body: "Preparing release assets..."

  build:
    name: build-${{ matrix.goos }}-${{ matrix.goarch }}-${{ matrix.flavor }}
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    needs: prepare_release
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            cc: gcc
            flavor: glibc
          - goos: linux
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
            flavor: glibc
          - goos: linux
            goarch: amd64
            cc: musl-gcc
            flavor: musl
          - goos: linux
            goarch: arm64
            cc: zig
            flavor: musl
          - goos: windows
            goarch: amd64
            cc: x86_64-w64-mingw32-gcc
            flavor: windows

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          v="${{ inputs.version }}"
          if [[ -z "${v}" ]]; then
            echo "version is required" >&2
            exit 1
          fi
          if [[ "${v}" != v* ]]; then
            echo "version must start with 'v' (e.g. v1.0.0)" >&2
            exit 1
          fi
          if [[ "${v}" =~ [[:space:]] ]]; then
            echo "version must not contain spaces" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Install toolchains
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          FLAVOR: ${{ matrix.flavor }}
          CC_KIND: ${{ matrix.cc }}
        run: |
          set -euo pipefail
          apt-get update
          pkgs=(build-essential ca-certificates curl git xz-utils)
          if [[ "${GOOS}" == "linux" && "${GOARCH}" == "arm64" && "${FLAVOR}" == "glibc" ]]; then
            pkgs+=(gcc-aarch64-linux-gnu libc6-dev-arm64-cross)
          fi
          if [[ "${GOOS}" == "linux" && "${FLAVOR}" == "musl" && "${GOARCH}" == "amd64" ]]; then
            pkgs+=(musl-tools)
          fi
          if [[ "${GOOS}" == "windows" && "${GOARCH}" == "amd64" ]]; then
            pkgs+=(mingw-w64)
          fi
          apt-get install -y "${pkgs[@]}"

          if [[ "${CC_KIND}" == "zig" ]]; then
            curl -fsSL "https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz" -o /tmp/zig.tar.xz
            mkdir -p /opt/zig
            tar -xf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
            echo "/opt/zig" >> "${GITHUB_PATH}"
          fi

      - name: Prepare zig cross-cc wrapper
        if: matrix.cc == 'zig'
        shell: bash
        run: |
          set -euo pipefail
          target=""
          if [[ "${{ matrix.goos }}" == "linux" && "${{ matrix.flavor }}" == "musl" && "${{ matrix.goarch }}" == "arm64" ]]; then
            target="aarch64-linux-musl"
          else
            echo "unsupported zig matrix target: ${{ matrix.goos }}/${{ matrix.goarch }}/${{ matrix.flavor }}" >&2
            exit 1
          fi
          cat > /tmp/cc.sh <<EOF
          #!/usr/bin/env bash
          exec zig cc -target ${target} "\$@"
          EOF
          cat > /tmp/cxx.sh <<EOF
          #!/usr/bin/env bash
          exec zig c++ -target ${target} "\$@"
          EOF
          chmod +x /tmp/cc.sh /tmp/cxx.sh
          echo "CC=/tmp/cc.sh" >> "${GITHUB_ENV}"
          echo "CXX=/tmp/cxx.sh" >> "${GITHUB_ENV}"

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: jenfonro/MeowFilm-Frontend
          path: MeowFilm-Frontend
          fetch-depth: 0
          token: ${{ secrets.FRONTEND_TOKEN }}

      - name: Compute commit metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "BACKEND_COMMIT=$(git rev-parse --short=7 HEAD)" >> "${GITHUB_ENV}"
          echo "FRONTEND_COMMIT=$(git -C MeowFilm-Frontend rev-parse --short=7 HEAD)" >> "${GITHUB_ENV}"

      - name: Build frontend
        shell: bash
        run: |
          set -euo pipefail
          cd MeowFilm-Frontend
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install
          fi
          npm run build

      - name: Copy frontend dist
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public/dist
          mkdir -p public/dist
          cp -a MeowFilm-Frontend/dist/. public/dist/

      - name: Test
        shell: bash
        env:
          CGO_ENABLED: "1"
          CC: gcc
          CXX: g++
        run: |
          set -euo pipefail
          go test ./...

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          if [[ "${{ matrix.cc }}" != "zig" ]]; then
            export CC="${{ matrix.cc }}"
          fi

          ldflags="-s -w -X github.com/jenfonro/meowfilm/server/static.BuildAssetVersion=${{ inputs.version }}"

          if [[ "${GOOS}" == "windows" ]]; then
            ar_bin="x86_64-w64-mingw32-ar"
            command -v "${ar_bin}" >/dev/null 2>&1 || { echo "missing archiver: ${ar_bin}" >&2; exit 1; }
            shim_dir="$(mktemp -d /tmp/mf_win_shim.XXXXXX)"
            trap 'rm -rf "${shim_dir}"' EXIT
            printf '%s\n' \
              '#ifdef _WIN32' \
              'static char **mf_dummy_environ = 0;' \
              'char ***__p__environ(void) { return &mf_dummy_environ; }' \
              'void *__imp___p__environ = (void *)&__p__environ;' \
              '#endif' > "${shim_dir}/environ_shim.c"
            "${CC}" -c "${shim_dir}/environ_shim.c" -o "${shim_dir}/environ_shim.o"
            "${ar_bin}" rcs "${shim_dir}/libenviron_shim.a" "${shim_dir}/environ_shim.o"
            ldflags+=" -extldflags \"-L${shim_dir} -lenviron_shim -lwinpthread -lmsvcrt\""
          fi

          mkdir -p dist
          ext=""
          if [[ "${GOOS}" == "windows" ]]; then ext=".exe"; fi
          name_suffix=""
          if [[ "${GOOS}" == "windows" ]]; then
            name_suffix="windows_${GOARCH}"
          elif [[ "${{ matrix.flavor }}" == "musl" ]]; then
            name_suffix="linux_musl_${GOARCH}"
          else
            name_suffix="linux_${GOARCH}"
          fi
          out="dist/meowfilm_${name_suffix}${ext}"
          go build -trimpath -ldflags "${ldflags}" -o "${out}" .
          echo "built: ${out}"
          echo "ASSET_PATH=${out}" >> "${GITHUB_ENV}"

      - name: Upload asset to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          files: ${{ env.ASSET_PATH }}
          overwrite_files: true

  release:
    name: release
    runs-on: ubuntu-latest
    needs: [prepare_release, build]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout frontend (for release notes)
        uses: actions/checkout@v4
        with:
          repository: jenfonro/MeowFilm-Frontend
          path: MeowFilm-Frontend
          fetch-depth: 0
          token: ${{ secrets.FRONTEND_TOKEN }}

      - name: Generate release notes (backend + frontend)
        shell: bash
        run: |
          set -euo pipefail

          current_tag="${{ inputs.version }}"
          base_tag="$(
            git tag --merged HEAD --list 'v*' \
              | grep -Ev '(^$|beta|timestamp)' \
              | grep -vx "${current_tag}" \
              | sort -V \
              | tail -n 1 \
              || true
          )"

          {
            echo "## Build"
            echo "- version: ${current_tag}"
            echo "- backend: $(git rev-parse --short=7 HEAD) ($(git rev-parse HEAD))"
            echo "- frontend: $(git -C MeowFilm-Frontend rev-parse --short=7 HEAD) ($(git -C MeowFilm-Frontend rev-parse HEAD))"
            echo

            if [[ -n "${base_tag}" ]]; then
              base_sha="$(git rev-parse "${base_tag}")"
              base_date="$(git log -1 --format=%cI "${base_tag}")"

              echo "## Backend changes"
              echo "- base: ${base_tag} (${base_sha})"
              echo "- commits: $(git rev-list --count "${base_tag}..HEAD")"
              echo
              git log --oneline "${base_tag}..HEAD" || true
              echo

              echo "## Frontend changes"
              echo "- since: ${base_tag} (${base_date})"
              echo
              git -C MeowFilm-Frontend log --oneline --since="${base_date}" || true
            else
              echo "## Backend changes"
              echo "(no stable v* tag found on this branch)"
              echo
              git log --oneline -n 50 || true
              echo

              echo "## Frontend changes"
              echo
              git -C MeowFilm-Frontend log --oneline -n 50 || true
            fi
          } > notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          body_path: notes.md

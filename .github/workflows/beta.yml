name: Beta

run-name: Beta #${{ github.run_number }}

on:
  workflow_dispatch:

concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  BETA_TAG: beta
  BETA_BUILD_VERSION: v0.0.0-beta.${{ github.run_id }}.${{ github.run_attempt }}

jobs:
  prepare_release:
    name: prepare-beta
    runs-on: ubuntu-latest
    steps:
      - name: Update moving beta tag & delete old beta release
        uses: actions/github-script@v7
        env:
          BETA_TAG: ${{ env.BETA_TAG }}
        with:
          script: |
            const tag = process.env.BETA_TAG || 'beta'
            const owner = context.repo.owner
            const repo = context.repo.repo

            // Move/create tag -> current commit
            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` })
              await github.rest.git.updateRef({ owner, repo, ref: `tags/${tag}`, sha: context.sha, force: true })
            } catch (e) {
              if (e.status !== 404) throw e
              await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha: context.sha })
            }

            // Delete existing release so beta is re-published with fresh assets.
            try {
              const rel = await github.rest.repos.getReleaseByTag({ owner, repo, tag })
              await github.rest.repos.deleteRelease({ owner, repo, release_id: rel.data.id })
            } catch (e) {
              if (e.status !== 404) throw e
            }

      - name: Ensure beta release exists
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BETA_TAG }}
          name: ${{ env.BETA_TAG }}
          prerelease: true
          body: "Preparing beta assets..."

  build:
    name: build-${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    needs: prepare_release
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            cc: gcc
          - goos: windows
            goarch: amd64
            cc: x86_64-w64-mingw32-gcc

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install base toolchain
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y build-essential ca-certificates curl git

      - name: Install mingw toolchain
        if: matrix.goos == 'windows' && matrix.goarch == 'amd64'
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y mingw-w64

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: jenfonro/MeowFilm-Frontend
          path: MeowFilm-Frontend
          token: ${{ secrets.FRONTEND_TOKEN }}

      - name: Compute commit metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "BACKEND_COMMIT=$(git rev-parse --short=6 HEAD)" >> "${GITHUB_ENV}"
          echo "FRONTEND_COMMIT=$(git -C MeowFilm-Frontend rev-parse --short=6 HEAD)" >> "${GITHUB_ENV}"

      - name: Build frontend
        shell: bash
        run: |
          set -euo pipefail
          cd MeowFilm-Frontend
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install
          fi
          npm run build

      - name: Copy frontend dist
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public/dist
          mkdir -p public/dist
          cp -a MeowFilm-Frontend/dist/. public/dist/

      - name: Test
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          go test ./...

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.cc }}
        run: |
          set -euo pipefail
          ldflags="-s -w \
            -X github.com/jenfonro/meowfilm/server/static.BuildAssetVersion=${{ env.BETA_BUILD_VERSION }} \
            -X github.com/jenfonro/meowfilm/server/static.BuildBackendCommit=${{ env.BACKEND_COMMIT }} \
            -X github.com/jenfonro/meowfilm/server/static.BuildFrontendCommit=${{ env.FRONTEND_COMMIT }}"

          if [[ "${GOOS}" == "windows" ]]; then
            ar_bin="x86_64-w64-mingw32-ar"
            command -v "${ar_bin}" >/dev/null 2>&1 || { echo "missing archiver: ${ar_bin}" >&2; exit 1; }
            shim_dir="$(mktemp -d /tmp/mf_win_shim.XXXXXX)"
            trap 'rm -rf "${shim_dir}"' EXIT
            printf '%s\n' \
              '#ifdef _WIN32' \
              'static char **mf_dummy_environ = 0;' \
              'char ***__p__environ(void) { return &mf_dummy_environ; }' \
              'void *__imp___p__environ = (void *)&__p__environ;' \
              '#endif' > "${shim_dir}/environ_shim.c"
            "${CC}" -c "${shim_dir}/environ_shim.c" -o "${shim_dir}/environ_shim.o"
            "${ar_bin}" rcs "${shim_dir}/libenviron_shim.a" "${shim_dir}/environ_shim.o"
            ldflags+=" -extldflags \"-L${shim_dir} -lenviron_shim -lwinpthread -lmsvcrt\""
          fi

          mkdir -p dist
          ext=""
          if [[ "${GOOS}" == "windows" ]]; then ext=".exe"; fi
          out="dist/meowfilm_${GOOS}_${GOARCH}${ext}"
          go build -trimpath -ldflags "${ldflags}" -o "${out}" .
          echo "built: ${out}"
          echo "ASSET_PATH=${out}" >> "${GITHUB_ENV}"

      - name: Upload beta asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BETA_TAG }}
          files: ${{ env.ASSET_PATH }}
          prerelease: true
          overwrite_files: true

  release:
    name: release-beta
    runs-on: ubuntu-latest
    needs: [prepare_release, build]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout frontend (for release notes)
        uses: actions/checkout@v4
        with:
          repository: jenfonro/MeowFilm-Frontend
          path: MeowFilm-Frontend
          fetch-depth: 0
          token: ${{ secrets.FRONTEND_TOKEN }}

      - name: Generate release notes (since latest stable tag)
        shell: bash
        run: |
          set -euo pipefail

          base_tag="$(
            git tag --merged HEAD --list 'v*' \
              | grep -Ev '(^$|beta|timestamp)' \
              | sort -V \
              | tail -n 1 \
              || true
          )"

          {
            echo "## Build"
            echo "- version: ${{ env.BETA_BUILD_VERSION }}"
            echo "- backend: $(git rev-parse --short=7 HEAD) ($(git rev-parse HEAD))"
            echo "- frontend: $(git -C MeowFilm-Frontend rev-parse --short=7 HEAD) ($(git -C MeowFilm-Frontend rev-parse HEAD))"
            echo
            if [[ -n "${base_tag}" ]]; then
              base_sha="$(git rev-parse "${base_tag}")"
              base_date="$(git log -1 --format=%cI "${base_tag}")"

              echo "## Backend changes"
              echo "- base: ${base_tag} (${base_sha})"
              echo "- commits: $(git rev-list --count "${base_tag}..HEAD")"
              echo
              git log --oneline "${base_tag}..HEAD" || true
              echo

              echo "## Frontend changes"
              echo "- since: ${base_tag} (${base_date})"
              echo
              git -C MeowFilm-Frontend log --oneline --since="${base_date}" || true
            else
              echo "## Backend changes"
              echo "(no stable v* tag found on this branch)"
              echo
              git log --oneline -n 50 || true
              echo

              echo "## Frontend changes"
              echo
              git -C MeowFilm-Frontend log --oneline -n 50 || true
            fi
          } > notes.md

      - name: Publish beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BETA_TAG }}
          name: ${{ env.BETA_TAG }}
          prerelease: true
          body_path: notes.md

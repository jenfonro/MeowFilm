name: native-code-gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-code-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-code-gate:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.1.1.app/Contents/Developer
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run complete native code gate
        run: bash scripts/test-native.sh all

name: Test Beta

run-name: Test Beta #${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      skip_frontend:
        description: "Skip frontend build; compile backend only (true/false)"
        required: false
        default: "false"

concurrency:
  group: test-beta-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TEST_BUILD_VERSION: v0.0.0-test.${{ github.run_id }}.${{ github.run_attempt }}

jobs:
  build:
    name: test-build-${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            cc: gcc

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: ${{ inputs.skip_frontend != 'true' }}
        with:
          node-version: 20

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install base toolchain
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y build-essential ca-certificates curl git

      - name: Compute backend metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "BACKEND_COMMIT=$(git rev-parse --short=6 HEAD)" >> "${GITHUB_ENV}"
          echo "FRONTEND_COMMIT=skip-frontend" >> "${GITHUB_ENV}"

      - name: Compute frontend metadata
        if: ${{ inputs.skip_frontend != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "FRONTEND_COMMIT=$(git rev-parse --short=6 HEAD)" >> "${GITHUB_ENV}"

      - name: Build frontend
        if: ${{ inputs.skip_frontend != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install
          fi
          npm run build

      - name: Copy frontend dist
        if: ${{ inputs.skip_frontend != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf backend/public/dist
          mkdir -p backend/public/dist
          cp -a frontend/dist/. backend/public/dist/

      - name: Prepare embed placeholder for backend-only compile check
        if: ${{ inputs.skip_frontend == 'true' }}
        shell: bash
        run: |
          mkdir -p backend/public/dist
          printf '%s\n' '<!doctype html><title>Compile check</title>' > backend/public/dist/index.html
          cp backend/public/dist/index.html backend/public/dist/dashboard.html

      - name: Test
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          (cd backend && go test ./...)

      - name: Build (compile check only)
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.cc }}
        run: |
          set -euo pipefail
          ext=""
          if [[ "${GOOS}" == "windows" ]]; then ext=".exe"; fi
          out="/tmp/meowfilm_${GOOS}_${GOARCH}${ext}"
          (cd backend && go build -trimpath -ldflags="-s -w \
            -X github.com/jenfonro/meowfilm/server/static.BuildAssetVersion=${{ env.TEST_BUILD_VERSION }} \
            -X github.com/jenfonro/meowfilm/server/static.BuildBackendCommit=${{ env.BACKEND_COMMIT }} \
            -X github.com/jenfonro/meowfilm/server/static.BuildFrontendCommit=${{ env.FRONTEND_COMMIT }}" -o "${out}" .)
          rm -f "${out}"
          echo "compile ok: ${GOOS}/${GOARCH}"

name: test_release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Test version label (e.g. v1.0.0-test)"
        required: false
        default: "v0.0.0-test"
      skip_frontend:
        description: "Skip frontend build; compile backend only (true/false)"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  build:
    name: test-build-${{ matrix.goos }}-${{ matrix.goarch }}-${{ matrix.flavor }}
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            cc: gcc
            flavor: glibc
          - goos: linux
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
            flavor: glibc
          - goos: linux
            goarch: amd64
            cc: musl-gcc
            flavor: musl
          - goos: linux
            goarch: arm64
            cc: zig
            flavor: musl
          - goos: windows
            goarch: amd64
            cc: x86_64-w64-mingw32-gcc
            flavor: windows

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: ${{ inputs.skip_frontend != 'true' }}
        with:
          node-version: 20

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: backend/go.sum

      - name: Install toolchains
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          FLAVOR: ${{ matrix.flavor }}
          CC_KIND: ${{ matrix.cc }}
        run: |
          set -euo pipefail
          apt-get update
          pkgs=(build-essential ca-certificates curl git xz-utils)
          if [[ "${GOOS}" == "linux" && "${GOARCH}" == "arm64" && "${FLAVOR}" == "glibc" ]]; then
            pkgs+=(gcc-aarch64-linux-gnu libc6-dev-arm64-cross)
          fi
          if [[ "${GOOS}" == "linux" && "${FLAVOR}" == "musl" && "${GOARCH}" == "amd64" ]]; then
            pkgs+=(musl-tools)
          fi
          if [[ "${GOOS}" == "windows" && "${GOARCH}" == "amd64" ]]; then
            pkgs+=(mingw-w64)
          fi
          apt-get install -y "${pkgs[@]}"

          if [[ "${CC_KIND}" == "zig" ]]; then
            curl -fsSL "https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz" -o /tmp/zig.tar.xz
            mkdir -p /opt/zig
            tar -xf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
            echo "/opt/zig" >> "${GITHUB_PATH}"
          fi

      - name: Prepare zig cross-cc wrapper
        if: matrix.cc == 'zig'
        shell: bash
        run: |
          set -euo pipefail
          target=""
          if [[ "${{ matrix.goos }}" == "linux" && "${{ matrix.flavor }}" == "musl" && "${{ matrix.goarch }}" == "arm64" ]]; then
            target="aarch64-linux-musl"
          else
            echo "unsupported zig matrix target: ${{ matrix.goos }}/${{ matrix.goarch }}/${{ matrix.flavor }}" >&2
            exit 1
          fi
          cat > /tmp/cc.sh <<EOF
          #!/usr/bin/env bash
          exec zig cc -target ${target} "\$@"
          EOF
          cat > /tmp/cxx.sh <<EOF
          #!/usr/bin/env bash
          exec zig c++ -target ${target} "\$@"
          EOF
          chmod +x /tmp/cc.sh /tmp/cxx.sh
          echo "CC=/tmp/cc.sh" >> "${GITHUB_ENV}"
          echo "CXX=/tmp/cxx.sh" >> "${GITHUB_ENV}"

      - name: Compute commit metadata
        if: ${{ inputs.skip_frontend != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "BACKEND_COMMIT=$(git rev-parse --short=7 HEAD)" >> "${GITHUB_ENV}"
          echo "FRONTEND_COMMIT=$(git rev-parse --short=7 HEAD)" >> "${GITHUB_ENV}"

      - name: Build frontend
        if: ${{ inputs.skip_frontend != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install
          fi
          npm run build

      - name: Copy frontend dist
        if: ${{ inputs.skip_frontend != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf backend/public/dist
          mkdir -p backend/public/dist
          cp -a frontend/dist/. backend/public/dist/

      - name: Prepare embed placeholder for backend-only compile check
        if: ${{ inputs.skip_frontend == 'true' }}
        shell: bash
        run: |
          mkdir -p backend/public/dist
          printf '%s\n' '<!doctype html><title>Compile check</title>' > backend/public/dist/index.html
          cp backend/public/dist/index.html backend/public/dist/dashboard.html

      - name: Test
        shell: bash
        env:
          CGO_ENABLED: "1"
          CC: gcc
          CXX: g++
        run: |
          set -euo pipefail
          (cd backend && go test ./...)

      - name: Build (compile check only)
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          if [[ "${{ matrix.cc }}" != "zig" ]]; then
            export CC="${{ matrix.cc }}"
          fi

          ldflags="-s -w -X github.com/jenfonro/meowfilm/server/static.BuildAssetVersion=${{ inputs.version }}"

          if [[ "${GOOS}" == "windows" ]]; then
            ar_bin="x86_64-w64-mingw32-ar"
            command -v "${ar_bin}" >/dev/null 2>&1 || { echo "missing archiver: ${ar_bin}" >&2; exit 1; }
            shim_dir="$(mktemp -d /tmp/mf_win_shim.XXXXXX)"
            trap 'rm -rf "${shim_dir}"' EXIT
            printf '%s\n' \
              '#ifdef _WIN32' \
              'static char **mf_dummy_environ = 0;' \
              'char ***__p__environ(void) { return &mf_dummy_environ; }' \
              'void *__imp___p__environ = (void *)&__p__environ;' \
              '#endif' > "${shim_dir}/environ_shim.c"
            "${CC}" -c "${shim_dir}/environ_shim.c" -o "${shim_dir}/environ_shim.o"
            "${ar_bin}" rcs "${shim_dir}/libenviron_shim.a" "${shim_dir}/environ_shim.o"
            ldflags+=" -extldflags \"-L${shim_dir} -lenviron_shim -lwinpthread -lmsvcrt\""
          fi

          ext=""
          if [[ "${GOOS}" == "windows" ]]; then ext=".exe"; fi
          out="/tmp/meowfilm_${GOOS}_${GOARCH}${ext}"
          (cd backend && go build -trimpath -ldflags "${ldflags}" -o "${out}" .)
          rm -f "${out}"
          echo "compile ok: ${GOOS}/${GOARCH}/${{ matrix.flavor }}"
